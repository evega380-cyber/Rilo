name: Rilo checks
on:
  pull_request:
  push:
    branches: [feature/budget-core-v2]
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo export --platform web
